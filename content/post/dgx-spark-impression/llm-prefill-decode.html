<!-- Include directly inside your article's content column.
     Outer width/max-width intentionally unset: the host theme owns column sizing.
     Typography inherits from the host; theme follows ancestor .dark.
     No scripts, IDs, imports or external assets. CSS motion respects reduced motion.
-->
<style>
.llm-inference-figure{--lif-bg:#ffffff;--lif-ink:#30332f;--lif-muted:#63696d;--lif-line:#899087;--lif-faint:#dce0e2;--lif-wash:#f8f8f5;--lif-green:#788568;--lif-green-wash:#c7cfb9;--lif-gold:#aa8848;--lif-gold-wash:#e4cc94;--lif-neutral:#92918a;--lif-neutral-wash:#deddd6;display:block;min-width:0;box-sizing:border-box;margin:0;padding:0;contain:inline-size;color:var(--lif-ink);background:var(--lif-bg);isolation:isolate}
.dark .llm-inference-figure,.llm-inference-figure.dark{--lif-bg:#181b1e;--lif-ink:#e0e4e6;--lif-muted:#a4adb2;--lif-line:#79858b;--lif-faint:#394146;--lif-wash:#20262a;--lif-green:#a6b895;--lif-green-wash:#46543b;--lif-gold:#d2b473;--lif-gold-wash:#685531;--lif-neutral:#93938b;--lif-neutral-wash:#444740}
.llm-inference-figure > svg{display:block;position:static;width:100%;max-width:100%;min-width:0;height:auto;max-height:none;box-sizing:border-box;margin:0;padding:0;aspect-ratio:2/1;overflow:hidden}
.llm-inference-figure text{font-family:inherit;fill:var(--lif-ink);font-weight:400}
.llm-inference-figure .lif-title{font-size:38px;font-weight:600;letter-spacing:-.6px}
.llm-inference-figure .lif-label{font-size:18px;fill:var(--lif-muted)}
.llm-inference-figure .lif-small{font-size:16px;fill:var(--lif-muted)}
.llm-inference-figure .lif-math{font-family:inherit;font-size:22px;font-style:italic}
.llm-inference-figure .lif-line{fill:none;stroke:var(--lif-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.llm-inference-figure .lif-faint{fill:none;stroke:var(--lif-faint);stroke-width:1}
.llm-inference-figure .lif-token{fill:var(--lif-bg);stroke:var(--lif-line);stroke-width:1.5}
.llm-inference-figure .lif-compute{fill:var(--lif-wash);stroke:var(--lif-line);stroke-width:1.5}
.llm-inference-figure .lif-cell{fill:var(--lif-green-wash);stroke:var(--lif-green);stroke-width:1.3}
.llm-inference-figure .lif-neutral{fill:var(--lif-neutral-wash);stroke:var(--lif-neutral);stroke-width:1.3}
.llm-inference-figure .lif-accent{fill:var(--lif-gold-wash);stroke:var(--lif-gold);stroke-width:1.5}
.llm-inference-figure .lif-parallel{animation:lif-parallel-breathe 8s ease-in-out infinite}
.llm-inference-figure .lif-next{animation:lif-token-breathe 8s ease-in-out infinite}
@keyframes lif-parallel-breathe{0%,100%{opacity:.75}35%,65%{opacity:1}}
@keyframes lif-token-breathe{0%,65%,100%{opacity:1}80%{opacity:.65}}
@media(prefers-reduced-motion:reduce){.llm-inference-figure .lif-parallel,.llm-inference-figure .lif-next{animation:none}}
@media print{.llm-inference-figure{--lif-bg:#fff;--lif-ink:#30332f;--lif-muted:#63696d;--lif-line:#899087;--lif-faint:#dce0e2;--lif-wash:#f8f8f5;--lif-green:#75856d;--lif-green-wash:#edf0e8;--lif-gold:#9b8257;--lif-gold-wash:#f7f1e5}.llm-inference-figure *{animation:none!important}}
</style>
<div class="llm-inference-figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Prefill: prompt tokens processed in parallel. Decode: one token generated and fed back per step, with repeated weights and KV cache reads.">
<title>Prefill and Decode</title>
