<!-- Include directly in the article column. Outer width/max-width are owned by the host theme.
Font family inherits from the article; ancestor .dark selects the dark palette.
Source: https://huggingface.co/blog/moe
-->
<style>
.dense-moe-figure{--dmf-bg:#ffffff;--dmf-ink:#30332f;--dmf-muted:#63696d;--dmf-line:#899087;--dmf-faint:#dce0e2;--dmf-wash:#f8f8f5;--dmf-green:#788568;--dmf-green-wash:#c7cfb9;--dmf-gold:#aa8848;--dmf-gold-wash:#e4cc94;--dmf-neutral:#92918a;--dmf-neutral-wash:#deddd6;display:block;min-width:0;box-sizing:border-box;margin:0;padding:0;contain:inline-size;color:var(--dmf-ink);background:var(--dmf-bg);isolation:isolate}
.dark .dense-moe-figure,.dense-moe-figure.dark{--dmf-bg:#181b1e;--dmf-ink:#e0e4e6;--dmf-muted:#a4adb2;--dmf-line:#79858b;--dmf-faint:#394146;--dmf-wash:#20262a;--dmf-green:#a6b895;--dmf-green-wash:#46543b;--dmf-gold:#d2b473;--dmf-gold-wash:#685531;--dmf-neutral:#93938b;--dmf-neutral-wash:#444740}
.dense-moe-figure > svg{display:block;position:static;width:100%;max-width:100%;min-width:0;height:auto;max-height:none;box-sizing:border-box;margin:0;padding:0;aspect-ratio:2/1;overflow:hidden}
.dense-moe-figure text{font-family:inherit;fill:var(--dmf-ink);font-weight:400}
.dense-moe-figure .dmf-title{font-size:38px;font-weight:600;letter-spacing:-.6px}
.dense-moe-figure .dmf-label{font-size:18px;fill:var(--dmf-muted)}
.dense-moe-figure .dmf-small{font-size:16px;fill:var(--dmf-muted)}
.dense-moe-figure .dmf-math{font-family:inherit;font-size:22px;font-style:italic}
.dense-moe-figure .dmf-line{fill:none;stroke:var(--dmf-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dense-moe-figure .dmf-faint{fill:none;stroke:var(--dmf-faint);stroke-width:1}
.dense-moe-figure .dmf-token{fill:var(--dmf-bg);stroke:var(--dmf-line);stroke-width:1.5}
.dense-moe-figure .dmf-compute{fill:var(--dmf-wash);stroke:var(--dmf-line);stroke-width:1.5}
.dense-moe-figure .dmf-cell{fill:var(--dmf-green-wash);stroke:var(--dmf-green);stroke-width:1.3}
.dense-moe-figure .dmf-neutral{fill:var(--dmf-neutral-wash);stroke:var(--dmf-neutral);stroke-width:1.3}
.dense-moe-figure .dmf-accent{fill:var(--dmf-gold-wash);stroke:var(--dmf-gold);stroke-width:1.5}
.dense-moe-figure .dmf-parallel{animation:dmf-parallel-breathe 8s ease-in-out infinite}
.dense-moe-figure .dmf-next{animation:dmf-token-breathe 8s ease-in-out infinite}
@keyframes dmf-parallel-breathe{0%,100%{opacity:.75}35%,65%{opacity:1}}
@keyframes dmf-token-breathe{0%,65%,100%{opacity:1}80%{opacity:.65}}
@media(prefers-reduced-motion:reduce){.dense-moe-figure .dmf-parallel,.dense-moe-figure .dmf-next{animation:none}}
@media print{.dense-moe-figure{--dmf-bg:#fff;--dmf-ink:#30332f;--dmf-muted:#63696d;--dmf-line:#899087;--dmf-faint:#dce0e2;--dmf-wash:#f8f8f5;--dmf-green:#75856d;--dmf-green-wash:#edf0e8;--dmf-gold:#9b8257;--dmf-gold-wash:#f7f1e5}.dense-moe-figure *{animation:none!important}}

.dense-moe-figure .dmf-active-path{fill:none;stroke:var(--dmf-green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dense-moe-figure .dmf-inactive{fill:var(--dmf-neutral-wash);stroke:var(--dmf-neutral);stroke-width:1.3;opacity:.55}

.dense-moe-figure .dmf-title{font-size:34px}
</style>
<div class="dense-moe-figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Dense versus Mixture-of-Experts: dense feed-forward computation uses the whole block; sparse routing activates selected experts per token. Inactive expert weights still require storage.">
<title>Dense Model and Mixture-of-Experts</title>
<desc>Schematic decoder-only Transformer language models. Token embeddings pass through repeated Transformer blocks, followed by a language-model head producing logits. Both variants use attention. The dense variant uses a full shared feed-forward network; the sparse MoE variant routes each token to selected expert feed-forward networks and combines their outputs using routing weights. Six experts and two selected are illustrative, not specific model counts. Blocks repeat; real models may interleave dense and MoE blocks, and may have always-active shared experts. Normalization, residual connections and shared experts are omitted for clarity. With conventional resident-weight inference, inactive experts remain in memory; reduced active computation does not proportionally reduce weight storage. Offloading, quantization and sharding alter deployment memory requirements.</desc>
