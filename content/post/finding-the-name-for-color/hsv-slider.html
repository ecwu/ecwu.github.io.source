<hr>
<p class="text-2xl">Interactive: HSV Color Mixing</p>
<div id="hsv-slider-widget" class="w-full flex-none lg:flex space-x-5 items-center">
  <div class="flex-1">
    <div class="mb-5">
      <div class="flex items-center justify-between gap-4">
        <label for="hue-slider" class="form-label mb-0">Hue</label>
        <output id="hsv-hue" class="hsv-output" for="hue-slider">250°</output>
      </div>
      <input type="range"
        class="hsv-range hsv-range-hue"
        id="hue-slider"
        min="0"
        max="359"
        step="1"
        value="250"/>
      <div class="hsv-ticks" aria-hidden="true">
        <span>0°</span>
        <span>60°</span>
        <span>120°</span>
        <span>180°</span>
        <span>240°</span>
        <span>300°</span>
        <span>360°</span>
      </div>
    </div>
    <div class="mb-5">
      <div class="flex items-center justify-between gap-4">
        <label for="saturation-slider" class="form-label mb-0">Saturation</label>
        <output id="hsv-saturation" class="hsv-output" for="saturation-slider">100%</output>
      </div>
      <input type="range"
        class="hsv-range"
        id="saturation-slider"
        min="0"
        max="1"
        step="0.01"
        value="1"/>
    </div>
    <div>
      <div class="flex items-center justify-between gap-4">
        <label for="value-slider" class="form-label mb-0">Value</label>
        <output id="hsv-value" class="hsv-output" for="value-slider">100%</output>
      </div>
      <input type="range"
        class="hsv-range"
        id="value-slider"
        min="0"
        max="1"
        step="0.01"
        value="1"/>
    </div>
  </div>
  <div class="flex-1 flex justify-center">
    <canvas id="hsv-result" class="rounded-lg" height="240" width="240" style="width:min(100%, 240px); aspect-ratio: 1 / 1;"></canvas>
  </div>
</div>

<style>
  #hsv-slider-widget .hsv-output {
    min-width: 4.5rem;
    border-radius: 9999px;
    background: rgba(15, 23, 42, 0.08);
    padding: 0.15rem 0.65rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .dark #hsv-slider-widget .hsv-output {
    background: rgba(255, 255, 255, 0.12);
  }

  #hsv-slider-widget .hsv-range {
    --hsv-thumb-color: #ffffff;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 1rem;
    margin-top: 0.5rem;
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 9999px;
    background: linear-gradient(90deg, #000000 0%, #ffffff 100%);
    cursor: pointer;
  }

  .dark #hsv-slider-widget .hsv-range {
    border-color: rgba(255, 255, 255, 0.18);
  }

  #hsv-slider-widget .hsv-range-hue {
    background:
      linear-gradient(
        90deg,
        hsl(0deg 100% 50%) 0%,
        hsl(60deg 100% 50%) 16.67%,
        hsl(120deg 100% 50%) 33.33%,
        hsl(180deg 100% 50%) 50%,
        hsl(240deg 100% 50%) 66.67%,
        hsl(300deg 100% 50%) 83.33%,
        hsl(360deg 100% 50%) 100%
      );
  }

  #hsv-slider-widget .hsv-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 1.1rem;
    height: 1.1rem;
    border: 2px solid rgba(15, 23, 42, 0.85);
    border-radius: 9999px;
    background: var(--hsv-thumb-color);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.75);
  }

  #hsv-slider-widget .hsv-range::-moz-range-thumb {
    width: 1.1rem;
    height: 1.1rem;
    border: 2px solid rgba(15, 23, 42, 0.85);
    border-radius: 9999px;
    background: var(--hsv-thumb-color);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.75);
  }

  #hsv-slider-widget .hsv-range::-moz-range-track {
    height: 1rem;
    border: none;
    border-radius: 9999px;
    background: transparent;
  }

  #hsv-slider-widget .hsv-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 0.35rem;
    color: rgba(15, 23, 42, 0.68);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  .dark #hsv-slider-widget .hsv-ticks {
    color: rgba(255, 255, 255, 0.68);
  }
</style>

<script defer src="./hsv-slider.js"></script>
